name: Main App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres is only needed by test/ratelimit-shared.test.js, which boots two
    # server instances against one database to prove they share a rate-limit
    # window. That cannot be observed in a single process, and without a real
    # database here the suite would silently skip and the shared-store code path
    # would ship untested. Everything else still runs keyless on the file store.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whisker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whisker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Gate on what actually ships. The remaining high advisories are dev-only
      # (brace-expansion via @capacitor/cli); the full audit below reports them
      # without blocking, so the debt stays visible.
      - name: Audit runtime dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (report only)
        run: npm audit || true

      # TEST_DATABASE_URL is read only by the shared rate-limit suite, which passes
      # it to the servers it spawns. It is deliberately NOT named DATABASE_URL:
      # that would switch every other suite onto Postgres and change what they test.
      - name: Run tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/whisker_test

      - name: Syntax-check server
        run: |
          for f in server/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Build web
        run: npm run build:web

      - name: Build app (Capacitor bundle)
        run: npm run build:app

      - name: Build onefile
        run: npm run build:onefile

      - name: Smoke-test API (demo mode, no secrets)
        run: |
          PORT=8787 node server/index.js &
          SRV=$!
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8787/api/health > /dev/null; then
              echo "health OK"; break
            fi
            sleep 0.5
          done
          curl -fsS http://localhost:8787/api/health
          curl -fsS -X POST http://localhost:8787/api/auth/signup \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-smoke-otter-42"}' > /dev/null && echo "signup OK"
          kill $SRV 2>/dev/null || true
